    <radialGradient id="glow3" cx="0.5" cy="0.55" r="0.65">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur6" x="-40%" y="-40%" width="180%" height="180%">
