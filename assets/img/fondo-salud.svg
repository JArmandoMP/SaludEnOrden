      <stop offset="0.38" stop-color="#0aa4d8"/>
      <stop offset="0.72" stop-color="#2f7ff0"/>
      <stop offset="1" stop-color="#5b8cf7"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.22" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#8dfce8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8dfce8" stop-opacity="0"/>
